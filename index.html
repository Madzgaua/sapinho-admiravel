<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidade Aumentada - Mata Atlântica</title>

  <!-- Biblioteca do Google model-viewer (versão fixa) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Botão de AR (redundância: fica sempre embaixo do modelo) */
    .btn-ar {
      position: absolute;
      bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background-color: #2e7d32;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      padding: 16px 28px;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
      white-space: nowrap;
    }
    .btn-ar:active {
      background-color: #1b5e20;
      transform: translateX(-50%) scale(0.96);
    }

    /* Tela inicial: um toque em qualquer lugar abre a câmera em RA */
    #start {
      position: fixed;
      inset: 0;
      z-index: 1000;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      border: none;
      background: rgba(18, 18, 18, 0.92);
      color: #ffffff;
      font-family: inherit;
      cursor: pointer;
    }
    #start[hidden] { display: none; }
    #start:disabled { cursor: wait; }
    #start .icon  { font-size: 56px; }
    #start .title { font-size: 22px; font-weight: bold; }
    #start .hint  {
      font-size: 17px;
      padding: 14px 24px;
      border-radius: 50px;
      background: #2e7d32;
    }
    #start:disabled .hint { background: #424242; }

    /* Mensagens de erro / diagnóstico */
    #status {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 16px;
      right: 16px;
      z-index: 1100;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.8);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }
    #status[hidden] { display: none; }
  </style>
</head>
<body>

  <!--
    ar-modes: ordem de tentativa. Se o Scene Viewer der "Couldn't load object",
    teste trocar para: "webxr scene-viewer quick-look"
  -->
  <model-viewer
    id="animal-viewer"
    src="ostrich.glb"
    ios-src="ostrich.usdz"
    alt="Animal em extinção da Mata Atlântica"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral">

    <!-- Botão vinculado ao slot de AR: o próprio model-viewer cuida do clique -->
    <button slot="ar-button" class="btn-ar" type="button">
      📷 ATIVAR CÂMERA EM RA
    </button>

  </model-viewer>

  <!-- Tela inicial (o toque aqui é o "gesto do usuário" que os navegadores exigem para abrir a câmera) -->
  <button id="start" type="button" disabled>
    <span class="icon">📷</span>
    <span class="title">Mata Atlântica em Realidade Aumentada</span>
    <span id="start-label" class="hint">Carregando modelo…</span>
  </button>

  <p id="status" role="status" hidden></p>

  <script>
    const viewer     = document.getElementById('animal-viewer');
    const start      = document.getElementById('start');
    const startLabel = document.getElementById('start-label');
    const statusEl   = document.getElementById('status');

    function showStatus(msg) {
      statusEl.textContent = msg;
      statusEl.hidden = !msg;
    }

    function dismissStart() {
      start.hidden = true;
    }

    // Espera o model-viewer descobrir se o aparelho suporta AR (até ~4s)
    function waitForAR(timeoutMs) {
      return new Promise(function (resolve) {
        const t0 = Date.now();
        (function check() {
          if (viewer.canActivateAR) return resolve(true);
          if (Date.now() - t0 > timeoutMs) return resolve(false);
          setTimeout(check, 150);
        })();
      });
    }

    // Biblioteca do model-viewer não carregou (CDN bloqueada, sem internet etc.)
    const libTimer = setTimeout(function () {
      if (!customElements.get('model-viewer')) {
        dismissStart();
        showStatus('Não foi possível carregar a biblioteca de RA. Verifique a conexão e recarregue a página.');
      }
    }, 10000);

    let loadHandled = false;
    async function onModelLoaded() {
      if (loadHandled) return;
      loadHandled = true;
      clearTimeout(libTimer);

      const arOk = await waitForAR(4000);
      if (arOk) {
        startLabel.textContent = 'TOQUE NA TELA PARA ABRIR A CÂMERA EM RA';
        start.disabled = false;
      } else {
        dismissStart();
        showStatus('RA indisponível neste navegador. Abra o link no Chrome (Android) ou no Safari (iPhone) — leitores de QR Code e apps como Instagram/WhatsApp costumam abrir um navegador interno sem suporte.');
      }
    }

    // Um único ponto de disparo automático: o toque na tela inicial.
    // (Sem listener global na window, para não disparar junto com o botão de AR.)
    start.addEventListener('click', function () {
      dismissStart();
      try {
        const p = viewer.activateAR();
        if (p && p.catch) p.catch(onARFailed);
      } catch (e) {
        onARFailed(e);
      }
    });

    function onARFailed(err) {
      console.error('Falha ao iniciar RA:', err);
      showStatus('Não foi possível iniciar a RA automaticamente. Use o botão verde abaixo para tentar de novo.');
    }

    viewer.addEventListener('load', onModelLoaded);
    if (viewer.loaded) onModelLoaded();

    viewer.addEventListener('ar-status', function (e) {
      if (e.detail && e.detail.status === 'failed') onARFailed('ar-status: failed');
    });

    // Falha ao carregar o .glb (arquivo não encontrado, nome com maiúscula/minúscula errada, etc.)
    viewer.addEventListener('error', function (e) {
      console.error('Erro do model-viewer:', e.detail);
      dismissStart();
      showStatus('Não foi possível carregar o modelo 3D (' + viewer.getAttribute('src') + '). Confira o nome e o caminho do arquivo no GitHub.');
    });
  </script>

</body>
</html>
